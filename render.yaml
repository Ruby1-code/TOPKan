databases:
  - name: topkan-db
    databaseName: topkan
    user: topkan
    plan: basic-256mb

services:
  - type: web
    name: topkan
    runtime: ruby
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec puma -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: topkan-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
